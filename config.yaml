llm_judge:
  enabled: true
  model: "qwen2.5-coder:7b-instruct"
  ollama_url: "http://localhost:11434/api/generate"
  timeout_seconds: 90

  # single = one strategy, ensemble = vote across enabled strategies
  strategy_mode: "ensemble"
  primary_strategy: "cot"
  parser_mode: "embedded_json"
  use_frozen_config: false
  frozen_config_path: "data/aggregated/judge_freeze.json"

  strategies:
    cot:
      enabled: true
    zero_shot:
      enabled: true
    few_shot:
      enabled: true
    adaptive_cot:
      enabled: false
    self_verification:
      enabled: true
    self_consistency:
      enabled: false

  ensemble:
    # supported: majority, conservative_present, highest_confidence
    vote_rule: "majority"
    min_confidence: 0.0

  self_consistency_samples: 5

  temperature: 0.2
  top_p: 0.9
  top_k: 40
  num_predict: 250
  repeat_penalty: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  seed: 42
  max_retries: 1

evaluation:
  allowed_verdicts:
    - present
    - absent
    - uncertain
  clamp_confidence: true
  max_rationale_length: 600
  max_evidence_length: 600

logging:
  save_raw_model_output: true
  log_level: "INFO"
